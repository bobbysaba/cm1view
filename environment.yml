# cm1view environment (conda-forge, versions cm1view is tested with)
#   conda env create -f environment.yml
#   conda activate cm1view
# Update after editing:  conda env update -f environment.yml --prune
name: cm1view
channels:
  - conda-forge
dependencies:
  - python=3.12
  - panel=1.7.5
  - bokeh=3.7.3
  - param=2.2.1
  - numpy=1.26.4
  - scipy=1.16.0
  - pandas=2.3.1
  - xarray=2025.7.1
  - netcdf4=1.7.2
  - matplotlib-base=3.10.3  # no Qt: cm1view draws off-screen
  - contourpy=1.3.3
  - metpy=1.7.0
  - numba=0.61.2
  - scikit-image=0.25.2
  - pillow=11.3.0
  - plotly=5.24.1
  - pyvista=0.49.2         # rendered 3D scenes in figures (VTK off-screen)
  - vtk-base=9.6.0
  - cmocean=3.0.3          # cmo.* colormaps
  - cmweather=0.3.2        # HomeyerRainbow / ChaseSpectral colormaps in figures
  - websocket-client       # browser screenshots in tests/ (shot.py)
  - pytest=8.4.1           # tests/
  - pip
  - pip:
      - -e .
