site_name: cm1view
site_description: An interactive viewer for CM1 netCDF output
site_url: https://bobbysaba.github.io/cm1view/
repo_url: https://github.com/bobbysaba/cm1view
repo_name: bobbysaba/cm1view
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

# the home page is README.md, so the repo page and the site say the same thing
hooks:
  - docs/hooks/readme.py
exclude_docs: |
  hooks/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Installing: install.md
  - Running on a cluster: hpc.md
  - Using cm1view: guide.md
  - Settings: settings.md
  - Developing: developing.md
