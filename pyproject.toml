[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cm1view"
version = "0.2.0"
description = "Interactive web viewer for CM1 netCDF output"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bobby Saba", email = "bobbysabawx@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# environment.yml pins the versions cm1view is tested with (conda-forge); these are the
# looser requirements for a pip install into an existing environment.
dependencies = [
    "panel>=1.7,<2",
    "bokeh>=3.7,<4",
    "param>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "matplotlib>=3.9",
    "contourpy>=1.3",
    "metpy>=1.6",
    "numba>=0.60",
    "scikit-image>=0.24",
    "pillow>=10",
    "plotly>=5.24,<6",
    "cmocean>=3.0",
    "cmweather>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "websocket-client>=1.8"]

[project.urls]
Homepage = "https://github.com/bobbysaba/cm1view"

[project.scripts]
cm1view = "cm1view.__main__:main"

[tool.setuptools]
packages = ["cm1view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real and not browser'"
markers = [
    "real: checks on your own CM1 run, CM1VIEW_TEST_RUN=/path (slow; pytest -m real)",
    "browser: drives headless Firefox for screenshots (pytest -m browser)",
]
filterwarnings = [  # third-party noise only
    'ignore:numpy.ndarray size changed:RuntimeWarning',
    "ignore:'\\w+' deprecated - use:DeprecationWarning",
    'ignore:The (LATITUDE|LONGITUDE)_FORMATTER:DeprecationWarning',
]
